<section class="newsletter d-flex flex-column gap-3" style="padding: 0.75rem 0">
  <h4 class="title-3">Fique antenado nos nossos próximos posts!</h4>

  <form
    class="d-flex align-items-end"
    style="gap: 0.75rem"
    action="{{ '/_api/processaNewsletter.php' | absolute_url }}"
    method="POST"
  >
    <!-- prettier-ignore -->
    {% include field.html
      label_position='left'
      label='Seu melhor e-mail'
      placeholder='joaodasilva@email.com'
      name='email'
      required=true

    {% include button.html type='submit' name='acao' text='Cadastrar' %}
  </form>
</section>
